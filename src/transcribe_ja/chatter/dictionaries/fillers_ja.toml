# =====================================================================
#  フィラー（「えー」「あのー」など意味を持たないつなぎ言葉）の辞書
#
#  この行を書き換えると、除去する言葉を調整できます。
#  行を消せばその言葉は除去されなくなります。
#  文字コードは UTF-8 のまま保存してください。
# =====================================================================

# --- どこに出てきても必ず除去する言葉 -------------------------------
# 長音符が付いているものなど、フィラー以外の意味を持たない語だけを入れます。
always = [
  "えー", "えーと", "えーっと", "えっと", "えと",
  "あのー", "あのう", "あーの",
  "そのー", "そのう",
  "うーん", "うーむ", "んー", "んーと",
  "あー", "あぁ", "おー", "うー",
  "まあその", "でまあ",
]

# --- 直後に読点・句点・空白が来るときだけ除去する言葉 ----------------
# 「あの人」の「あの」まで消えないようにするための仕組みです。
# 「あの、」のように区切りが続くときだけフィラーとみなします。
boundary = [
  "あの", "その", "まあ", "まぁ", "なんか", "なんていうか", "ていうか",
  "やっぱ", "ちょっと", "ま",
]

# --- 文頭にあるときだけ除去する言葉 ----------------------------------
sentence_head = [
  "でまあ", "まあ", "まぁ", "えー", "はい", "うん",
]

# --- 連続したときに 1 回だけ残す相槌 ---------------------------------
# 「はい、はい、はい」→「はい」のようにまとめます。
repeated_aizuchi = [
  "はい", "ええ", "うん", "そうですね", "なるほど", "はいはい",
]

# --- 除去しない例外 ---------------------------------------------------
# ここに入れた表現は、上のリストに一致しても除去しません。
# 「はい、承知しました」の「はい」を残したい、といった調整に使います。
keep = [
  "はい、承知",
  "はい、わかりました",
  "はい、そうです",
]
