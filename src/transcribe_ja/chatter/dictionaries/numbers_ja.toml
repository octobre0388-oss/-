# =====================================================================
#  数字表記の統一に使う辞書
#
#  [format] numbers = "arabic" のとき、漢数字を算用数字に直します。
#  ただし「一般」「一緒」のような熟語まで壊さないよう、
#  下の counters（助数詞）が続く場合だけ変換します。
# =====================================================================

# --- 漢数字を算用数字に直してよい助数詞 -------------------------------
counters = [
  "人", "個", "回", "件", "枚", "本", "冊", "台", "匹", "頭",
  "日", "月", "年", "時", "分", "秒", "週", "ヶ月", "か月", "カ月",
  "円", "ドル", "%", "％", "度", "階", "番", "位", "点", "割",
  "つ目", "番目", "行目", "ページ", "ヵ所", "箇所", "種類", "倍",
]

# --- 変換してはいけない語 ---------------------------------------------
# 漢数字を含むが数量ではない言葉。ここに入れた語はそのまま残します。
exclude = [
  "一般", "一緒", "一部", "一方", "一応", "一切", "一度に", "一体",
  "一人前", "一言", "一瞬", "一番", "一次", "一定", "一致",
  "二度と", "十分に", "百貨店", "千差万別", "万一", "四苦八苦",
  "三角", "四角", "五感", "六法", "七夕", "八方", "九州",
]
