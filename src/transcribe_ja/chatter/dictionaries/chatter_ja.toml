# =====================================================================
#  雑談・不要部分の判定辞書
#
#  各セグメント（発話のかたまり）に点数を付け、合計が
#  [thresholds] の値を超えたものを「不要」と判定してカットします。
#
#  ・切りすぎると感じたら → [thresholds] の値を大きくする
#  ・切り足りないと感じたら → [thresholds] の値を小さくする
#  ・特定の言い回しを守りたい → [patterns] の main_topic に足す
#
#  文字コードは UTF-8 のまま保存してください。
# =====================================================================

[thresholds]
# 安全度ごとの判定ライン。合計点がこの値以上なら「不要」とみなします。
# config.toml の [chatter] safety で、どれを使うかを選びます。
conservative = 0.80   # 迷ったら残す（既定）
balanced     = 0.60   # 標準
aggressive   = 0.45   # 迷ったら切る

# 冒頭・末尾とみなす割合（0.1 なら前後 10% ずつ）。
# この範囲にある雑談は、途中にあるものより不要である可能性が高いと判断します。
edge_ratio = 0.10

# 発話密度がこれ未満なら「中身が薄い」とみなす（1 秒あたりの文字数）。
low_density_cps = 1.5

# これより長いセグメントは本編である可能性が高いとみなす（秒）。
long_segment_seconds = 20.0

# これより短いセグメントは断片とみなす（秒）。
short_segment_seconds = 2.0


[weights]
# それぞれの判定に与える点数。マイナスは「残す方向」に働きます。
greeting        = 0.50   # 挨拶
equipment       = 0.60   # 機材確認
smalltalk       = 0.50   # 雑談
closing         = 0.45   # 締めの雑談
laughter_only   = 0.60   # 笑い声だけ
aizuchi_only    = 0.50   # 相槌だけ
low_density     = 0.20   # 発話密度が低い
near_edges      = 0.25   # 冒頭・末尾にある
short_fragment  = 0.15   # 極端に短い断片
long_segment    = -0.35  # 長いセグメント（本編の可能性が高い）
main_topic      = -0.50  # 本編を示す言葉を含む


[patterns]
# --- 挨拶 -------------------------------------------------------------
greeting = [
  "お疲れ様です", "お疲れさまです", "おつかれさまです", "お疲れ様でした",
  "よろしくお願いします", "よろしくお願いいたします",
  "おはようございます", "こんにちは", "こんばんは",
  "ご無沙汰しております", "お世話になっております",
  "はじめまして",
]

# --- 機材・接続の確認 -------------------------------------------------
equipment = [
  "聞こえてますか", "聞こえますか", "聞こえてます",
  "音声大丈夫", "音大丈夫", "マイク大丈夫", "マイク入って",
  "録音始まって", "録画始まって", "録音してます", "録画してます",
  "画面見えて", "画面共有", "共有できてます",
  "電波悪い", "回線が", "音が途切れ", "ミュート",
  "カメラ", "映ってますか", "接続でき",
]

# --- 雑談 -------------------------------------------------------------
smalltalk = [
  "そういえば", "ところで話変わる", "話変わりますけど", "余談ですが",
  "全然関係ない", "関係ない話", "雑談ですが",
  "暑いですね", "寒いですね", "いい天気", "雨すごい", "台風",
  "ご飯食べ", "お昼何", "ランチ", "飲みに行",
  "週末", "連休", "休みは", "旅行",
  "体調どう", "風邪", "花粉",
]

# --- 締め・終わりの雑談 -----------------------------------------------
closing = [
  "以上で終わり", "それでは失礼します", "失礼いたします",
  "ありがとうございました", "お先に失礼",
  "また来週", "また明日", "では解散",
  "録音止め", "録画止め", "停止します",
]

# --- 本編を示す言葉（含まれていたら残す方向に働く） -------------------
main_topic = [
  "資料", "議題", "課題", "検討", "決定", "承認", "報告", "共有事項",
  "スケジュール", "納期", "予算", "見積", "契約", "要件", "仕様",
  "対応します", "進めます", "確認します", "お願いしたい",
  "結論", "方針", "リスク", "問題点", "改善",
  "次のステップ", "アクション", "担当",
  "ページ", "項目", "番目",
]

# --- 笑い声・感嘆詞（これだけで構成される区間は不要とみなす） ---------
laughter = [
  "笑", "ははは", "はは", "ふふ", "へへ", "あはは", "www",
  "(笑)", "（笑）",
]

# --- 相槌（これだけで構成される区間は不要とみなす） -------------------
aizuchi = [
  "はい", "ええ", "うん", "うーん", "そうですね", "なるほど",
  "たしかに", "ですね", "そうそう", "ふむ", "おお", "へー", "ほう",
  "あー", "うんうん", "はいはい",
]
